name: Android arm64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/apple-style-two-actions
      - feature/pipeline-parity-and-two-actions

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with Git LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify model weights are real
        shell: bash
        run: |
          MODEL="android/app/src/main/assets/models/muometric_convnext_tiny_quantized.onnx"
          if ! test -f "$MODEL"; then
            echo "::error::ONNX model is missing."
            exit 1
          fi
          SIZE=$(stat -c%s "$MODEL")
          if [ "$SIZE" -lt 1048576 ]; then
            echo "::error::ONNX file is only ${SIZE} bytes. Git LFS did not restore the model object."
            head -n 3 "$MODEL" || true
            exit 1
          fi
          echo "Verified ONNX model size: ${SIZE} bytes"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::ANDROID_HOME and ANDROID_SDK_ROOT are not set on the runner."
            exit 1
          fi

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found under $SDK_ROOT/cmdline-tools."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build arm64 release APK
        working-directory: android
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nose-app-arm64-release
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
